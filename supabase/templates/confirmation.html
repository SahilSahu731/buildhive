<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>BuildWithMe verification code</title>
  </head>
  <body
    style="
      margin: 0;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      color: #f1f0ed;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden">
      Your BuildWithMe verification code expires in 10 minutes.
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#000000"
    >
      <tr>
        <td align="center" style="padding: 48px 20px">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 100%;
              background: #0c0c0c;
              border: 1px solid #323232;
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 36px 28px">
                <p
                  style="
                    margin: 0 0 32px;
                    font-size: 22px;
                    font-weight: 700;
                    color: #f1f0ed;
                  "
                >
                  buildwithme<span style="color: #ee8654">.</span>
                </p>
                <h1
                  style="
                    font-size: 27px;
                    line-height: 1.3;
                    margin: 0 0 14px;
                    font-weight: 500;
                  "
                >
                  Verify your email
                </h1>
                <p
                  style="
                    font-size: 16px;
                    line-height: 1.8;
                    color: #a5a49f;
                    margin: 0 0 24px;
                  "
                >
                  Enter this code in BuildWithMe to verify your email and create
                  your builder profile.
                </p>
                <p
                  style="
                    font-family: Courier, monospace;
                    font-size: 34px;
                    line-height: 1.4;
                    font-weight: 700;
                    letter-spacing: 7px;
                    background: #151515;
                    border: 1px solid #484848;
                    color: #ee8654;
                    padding: 22px 12px;
                    text-align: center;
                    border-radius: 10px;
                    margin: 0 0 24px;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    font-size: 13px;
                    line-height: 1.8;
                    color: #a5a49f;
                    margin: 0;
                  "
                >
                  This code expires in 10 minutes. If you didn't request it, you
                  can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
