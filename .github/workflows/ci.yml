name: BuildHive checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buildhive_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/buildhive_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buildhive_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      SECRETS_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run db:deploy
      - run: npx --prefix server playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser UI acceptance
        run: |
          BUILDHIVE_DIST_DIR=.next-qa API_INTERNAL_URL=http://127.0.0.1:5100 npm --prefix client run dev -- --hostname 127.0.0.1 --port 3101 > /tmp/buildhive-ui.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3101/ > /dev/null; then break; fi
            sleep 1
          done
          node --import ./server/node_modules/tsx/dist/loader.mjs infra/qa-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildhive-ui-screenshots
          path: artifacts/qa/
          if-no-files-found: ignore
