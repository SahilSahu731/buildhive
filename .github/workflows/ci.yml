name: Verify BuildWithMe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: buildwithme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: buildwithme_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify migration and database authorization
        run: >-
          psql -v ON_ERROR_STOP=1
          -f supabase/tests/scaffold.sql
          -f supabase/migrations/202611160001_initial_platform.sql
          -f supabase/tests/authorization.sql
      - run: npm run build
